[project]
name = "async-task-queue-api"
version = "0.1.0"
description = "Production-grade async job processing API with FastAPI, Celery, Redis and a multi-threaded Python client library."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Helio Zaia Franciscon", email = "heliozf99@gmail.com"},
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.27.0",
    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
    # Data validation & config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # File processing
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.10.0",
    # Logging
    "loguru>=0.7.0",
    # HTTP client (for client library dev)
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*", "client*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring Redis and Celery",
    "e2e: tests requiring full docker-compose stack",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
